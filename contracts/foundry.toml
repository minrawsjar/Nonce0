# forge generates NEITHER solc nor evm_version. Pinning them the minute this
# directory exists is what makes the step-12 `forge install Uniswap/v4-periphery`
# an additive change rather than a retrofit under time pressure.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["../packages/pq-wallet/node_modules"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The FORS hot loop holds more live values than the legacy stack allocator can
# place. via_ir also does markedly better on the scratch-buffer pattern.
via_ir = true

# Read-only, and scoped to the fixture directory. test/fixtures/fors-vectors.json is
# generated by packages/pq-wallet and is what pins the Solidity verifier to the
# TypeScript signer: two implementations that agree by inspection agree by luck.
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  # The single source of truth for addresses. Read-only: scripts never write it.
  { access = "read", path = "../deployments" },
]

# The state machine is the risk in this design, not the crypto. Fuzz it hard.
[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 32

# Named so a deploy is `--rpc-url arc_testnet` rather than a URL pasted from
# memory. Verified live: eth_chainId returns 0x4cef52 (5042002), and USDC at
# 0x3600...0000 reports symbol "USDC" and 6 decimals, which is the interface
# PrivatePool is written against. Arc's NATIVE USDC is 18 decimals and is used
# for gas; confusing the two is a factor of 10^12.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
