# Opaque V1 subgraph schema (§8).
#
# HARD CONSTRAINT (§8, applies to every entity below): index the ELIGIBLE POOL
# and AGGREGATE statistics only. Nothing here may record which ring member or
# which relay hop was used for a given payment — publishing that would defeat
# the exact thing the ring signature and the relay mesh exist to hide.
#
# The previous revision violated it by publishing a funding-cluster id per
# member; what replaced it is below, on fundingConcentrationBucket.

type RingMember @entity(immutable: false) {
  "The note commitment (§6.6). Ring eligibility requires a real pool deposit."
  id: ID!

  "Pool this note was deposited into — `${poolId(scope)}-${denomination}`."
  pool: RingPool!
  denomination: BigInt!

  enrolledAt: BigInt!

  "Aggregate count across all rings. Never which ring, never which payment."
  timesUsedInRing: Int!

  "When a ring last included this member (block timestamp). Aggregate, §8.1."
  lastUsedAt: BigInt

  """
  How large a share of the pool this member's funding cluster holds, coarsely
  bucketed: 0 = smallest share .. 3 = dominant share. This is the ONLY funding
  signal published.

  It is deliberately NOT the cluster identity. A cluster id per member is an
  equivalence class over note commitments — it lets anyone group notes by their
  common funder, which is the linkage the ring exists to destroy.

  Emitted as null unless at least FUNDING_BUCKET_K (5) members share this
  member's funder, so a bucket can never single a member out. Null means
  UNKNOWN and must never be read as zero (see RingCandidate in
  @opaque/protocol-types). Computed at enrollment, from PrivatePool's
  DepositFrom: the funder's share of the pool when this note joined it.
  """
  fundingConcentrationBucket: Int

  "Any on-chain activity besides enrollment/ring use. §8.1 step 3."
  hasOtherActivity: Boolean
}

"""
Bookkeeping for fundingConcentrationBucket: how many notes one depositor has
put in one pool. Everything here is already public in PrivatePool's
DepositFrom events; RingMember never links to it.
"""
type FundingCluster @entity(immutable: false) {
  "`${poolId}-${depositor}`."
  id: ID!
  memberCount: Int!
}

type RingPool @entity(immutable: false) {
  "`${poolId(scope)}-${denomination}` — per (chain, pool, denomination)."
  id: ID!

  poolSize: Int!
  observedAt: BigInt!
}

# ── mesh (§8.2) ────────────────────────────────────────────────────────────

type RelayNode @entity(immutable: false) {
  "The signed directory's relay id (\"R1\"…), decoded from RelayDirectory's bytes32 nodeId."
  id: ID!

  endpoint: String!

  """
  keccak256 of the hop-encryption key. Raw keys are never directory-discovered:
  the client obtains them from its signed, pinned relay directory and checks
  this commitment before accepting Graph's advisory health values.
  """
  kemKeyCommitment: Bytes!
  keyEpoch: BigInt!

  """
  Path diversity is per operator, not per node — three nodes run by one
  operator are one hop's worth of protection.
  """
  operatorId: String!

  "% of recent batch windows successfully served, in bps (0..10000)."
  reliabilityScore: BigInt!

  "Avg # of other messages batched alongside this node's traffic recently."
  batchOccupancy: BigInt!

  """
  How often this node has been picked recently. Aggregate only — never which
  path, never which message.
  """
  recentSelectionCount: BigInt!

  lastSeenAt: BigInt!
}

type RelayDirectory @entity(immutable: false) {
  "Singleton."
  id: ID!
  version: String!
  nodeCount: Int!
  observedAt: BigInt!
}
