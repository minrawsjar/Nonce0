<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" fill="none" role="img" aria-label="Wallet, ring-signed payment, relay mesh, policy check, settlement"><rect x="18" y="70" width="168" height="72" rx="4" fill="#1b1826" stroke="#6f6880" stroke-opacity="0.5"/><text x="102.0" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" letter-spacing="1" fill="#e8e4f0">WALLET</text><text x="102.0" y="119" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="14" fill="#6f6880">holds the key</text><path d="M192 106 L214 106" stroke="#6f6880" stroke-opacity=".7"/><path d="M208 101 L214 106 L208 111" stroke="#6f6880" stroke-opacity=".7" fill="none"/><rect x="220" y="70" width="168" height="72" rx="4" fill="#1b1826" stroke="#a396d9" stroke-opacity="0.9"/><text x="304.0" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" letter-spacing="1" fill="#e8e4f0">RING SIGNATURE</text><text x="304.0" y="119" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="14" fill="#6f6880">on-chain verified</text><text x="304.0" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing=".6" fill="#d6a94f">hides WHO</text><line x1="304.0" y1="150" x2="304.0" y2="170" stroke="#d6a94f" stroke-opacity=".45"/><path d="M394 106 L416 106" stroke="#6f6880" stroke-opacity=".7"/><path d="M410 101 L416 106 L410 111" stroke="#6f6880" stroke-opacity=".7" fill="none"/><rect x="422" y="70" width="168" height="72" rx="4" fill="#1b1826" stroke="#a396d9" stroke-opacity="0.9"/><text x="506.0" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" letter-spacing="1" fill="#e8e4f0">RELAY MESH</text><text x="506.0" y="119" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="14" fill="#6f6880">3 hops, batched</text><text x="506.0" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing=".6" fill="#d6a94f">hides WHERE</text><line x1="506.0" y1="150" x2="506.0" y2="170" stroke="#d6a94f" stroke-opacity=".45"/><path d="M596 106 L618 106" stroke="#6f6880" stroke-opacity=".7"/><path d="M612 101 L618 106 L612 111" stroke="#6f6880" stroke-opacity=".7" fill="none"/><rect x="624" y="70" width="168" height="72" rx="4" fill="#1b1826" stroke="#a396d9" stroke-opacity="0.9"/><text x="708.0" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" letter-spacing="1" fill="#e8e4f0">POLICY CHECK</text><text x="708.0" y="119" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="14" fill="#6f6880">inside the enclave</text><text x="708.0" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5" letter-spacing=".6" fill="#d6a94f">hides the INPUT</text><line x1="708.0" y1="150" x2="708.0" y2="170" stroke="#d6a94f" stroke-opacity=".45"/><path d="M798 106 L820 106" stroke="#6f6880" stroke-opacity=".7"/><path d="M814 101 L820 106 L814 111" stroke="#6f6880" stroke-opacity=".7" fill="none"/><rect x="826" y="70" width="168" height="72" rx="4" fill="#1b1826" stroke="#6f6880" stroke-opacity="0.5"/><text x="910.0" y="99" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11.5" letter-spacing="1" fill="#e8e4f0">SETTLEMENT</text><text x="910.0" y="119" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="14" fill="#6f6880">USDC over Arc</text><text x="18" y="34" font-family="Cormorant Garamond,serif" font-size="17" fill="#e8e4f0">One flow. Three different observers, each denied something different.</text><text x="18" y="222" font-family="ui-monospace,monospace" font-size="10.5" fill="#6f6880">validity is decided on-chain — no relay, operator or enclave is trusted for a payment to be valid</text></svg>