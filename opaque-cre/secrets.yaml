# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret ID the workflow requests with `runtime.getSecret({ id })`
# to the environment variable holding its value.
#
# The Vault DON releases these directly into the attested enclave. They are
# never exposed to node operators or to Workflow DON node memory.
#
# INTENT_KEY is the ML-KEM-768 decapsulation key. Its public half is published
# in the signed relay directory, and clients seal every payment intent to it.
# This is the whole reason the workflow can read a recipient that nothing else
# in the system can: Chainlink holds the key, but it does not define the
# cryptography, so the sealed intent stays post-quantum.
#
# CREDENTIAL_MAC verifies the recipient credential the client sealed in
# alongside the spend, so no compliance service is contacted per payment and
# the recipient never leaves the enclave.
secretsNames:
    INTENT_KEY:
        - SECRET_INTENT_KEY
    CREDENTIAL_MAC:
        - SECRET_CREDENTIAL_MAC
